<!doctype html>
<html lang="id">
<head>

<style>
  /* Kerangka halaman admin. Konten belum dibuat (langkah 3 dari 29). */
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--adm-bg);
    color: var(--adm-ink);
    font-family: var(--adm-font, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
    font-size: var(--adm-base, 15px);
    min-height: 100vh;
  }
  .adm-kerangka {
    padding-block: var(--adm-s-6, 24px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    color: var(--adm-muted);
    text-align: center;
  }
  .adm-kerangka[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="adm-kerangka" id="admKerangka">Memuat halaman admin…</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://bvltmjurkgnzmwtgdaic.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_F4qsCGTEYFcxgJmqJd0TZg_yas0Ho1g';
  var OWNER = 'mahkota.to3@gmail.com';
  var PROFIL = 'profil.html';

  function kembali() { window.location.replace(PROFIL); }

  if (!window.supabase) { kembali(); return; }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  sb.auth.getSession().then(function (r) {
    var sesi = r && r.data && r.data.session;
    var email = ((sesi && sesi.user && sesi.user.email) || '').toLowerCase();
    if (!sesi || email !== OWNER) { kembali(); return; }
    window.MTO_ADMIN = { sb: sb, user: sesi.user, owner: OWNER };
  }).catch(kembali);

  sb.auth.onAuthStateChange(function (event) {
    if (event === 'SIGNED_OUT') kembali();
  });
})();
</script>
</body>
</html>
