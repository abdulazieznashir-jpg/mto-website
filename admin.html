<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Mahkota Tahfizh Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/adm/tokens.css">
<style>
  /* Kerangka halaman admin. Konten belum dibuat (langkah 3 dari 29). */
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--adm-bg);
    color: var(--adm-ink);
    font-family: var(--adm-font, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
    font-size: var(--adm-base, 15px);
    min-height: 100vh;
  }
  .adm-kerangka {
    padding-block: var(--adm-s-6, 24px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    color: var(--adm-muted);
    text-align: center;
  }
  .adm-kerangka[hidden] { display: none !important; }

  /* Top bar: di HP tampil ringkas (merek + lonceng), di desktop lengkap (cari, lonceng, avatar) */
  .adm-topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-block: var(--adm-s-4, 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--adm-surface, #FFFFFF);
    border-bottom: 1px solid var(--adm-line, #ECE7DE);
    position: sticky; top: 0; z-index: 5; box-sizing: border-box;
  }
  .adm-topbar-brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .adm-topbar-nama { font-weight: 700; font-size: var(--adm-lg, 18px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adm-topbar-aksi { display: flex; align-items: center; gap: 8px; }
  .adm-topbar-aksi .adm-ikon-btn:not(.adm-ikon-btn-titik) { display: none; }
  .adm-ikon-btn {
    position: relative; width: 40px; height: 40px; border-radius: 999px; border: 0;
    background: var(--adm-bg, #FAF8F4); color: var(--adm-ink, #1D1D1F); font-size: 18px; cursor: pointer;
  }
  .adm-ikon-btn-titik::after {
    content: ""; position: absolute; top: 8px; right: 9px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--adm-gold, #B8912F);
  }
  .adm-avatar {
    width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--adm-gold-soft, #F6EEDC); color: var(--adm-gold-ink, #8A6A1F); font-weight: 700;
  }
  @media (min-width: 900px) {
    .adm-topbar { padding-block: var(--adm-s-4, 16px); padding-left: 32px; padding-right: 32px; }
    .adm-topbar-brand { display: none; }
    .adm-topbar-aksi { margin-left: auto; }
    .adm-topbar-aksi .adm-ikon-btn:not(.adm-ikon-btn-titik) { display: inline-flex; }
  }

  /* Sidebar desktop (layar lebar saja; HP memakai navigasi bawah pada langkah 6) */
  .adm-shell { display: block; }
  .adm-side { display: none; }
  @media (min-width: 900px) {
    .adm-shell { display: grid; grid-template-columns: var(--adm-sidebar-w, 240px) minmax(0, 1fr); min-height: 100vh; }
    .adm-side {
      display: flex; flex-direction: column; gap: var(--adm-s-4, 16px);
      position: sticky; top: 0; height: 100vh; box-sizing: border-box;
      background: var(--adm-surface, #FFFFFF);
      border-right: 1px solid var(--adm-line, #ECE7DE);
      padding-block: var(--adm-s-6, 24px);
      padding-left: 20px; padding-right: 16px;
      overflow-y: auto;
    }
    .adm-side-brand { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; }
    .adm-side-crown { color: var(--adm-gold, #B8912F); font-size: 26px; line-height: 1; }
    .adm-side-nama { font-weight: 700; line-height: 1.2; font-size: var(--adm-lg, 18px); }
    .adm-side-peran {
      display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 999px;
      background: var(--adm-gold-soft, #F6EEDC); color: var(--adm-gold-ink, #8A6A1F);
      font-size: var(--adm-xs, 12px); font-weight: 600;
    }
    .adm-nav { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
    .adm-nav a {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      border-radius: var(--adm-r-sm, 10px); color: var(--adm-ink, #1D1D1F);
      text-decoration: none; font-size: var(--adm-base, 15px);
    }
    .adm-nav a:hover { background: var(--adm-bg, #FAF8F4); }
    .adm-nav a[aria-current="page"] { background: var(--adm-gold-soft, #F6EEDC); color: var(--adm-gold-ink, #8A6A1F); font-weight: 600; }
    .adm-nav-ikon { width: 20px; text-align: center; color: var(--adm-muted, #6E6E73); }
    .adm-nav a[aria-current="page"] .adm-nav-ikon { color: var(--adm-gold-ink, #8A6A1F); }
    .adm-nav-lencana {
      margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px;
      background: var(--adm-gold, #B8912F); color: #FFFFFF; font-size: var(--adm-xs, 12px);
      font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    }
    .adm-main { min-width: 0; }
  }
</style>
</head>
<body>
<div class="adm-shell">
  <aside class="adm-side" aria-label="Navigasi admin">
    <div class="adm-side-brand">
      <span class="adm-side-crown" aria-hidden="true">♛</span>
      <div>
        <div class="adm-side-nama">Mahkota Tahfizh Online</div>
        <span class="adm-side-peran">Admin</span>
      </div>
    </div>
    <ul class="adm-nav">
      <li><a href="#dashboard" aria-current="page"><span class="adm-nav-ikon" aria-hidden="true">⌂</span>Dashboard</a></li>
      <li><a href="#murid"><span class="adm-nav-ikon" aria-hidden="true">☺</span>Murid</a></li>
      <li><a href="#pengajar"><span class="adm-nav-ikon" aria-hidden="true">✎</span>Pengajar</a></li>
      <li><a href="#jadwal"><span class="adm-nav-ikon" aria-hidden="true">▦</span>Jadwal</a></li>
      <li><a href="#pertemuan"><span class="adm-nav-ikon" aria-hidden="true">▶</span>Pertemuan</a></li>
      <li><a href="#periode"><span class="adm-nav-ikon" aria-hidden="true">▤</span>Periode</a></li>
      <li><a href="#permintaan"><span class="adm-nav-ikon" aria-hidden="true">⇄</span>Permintaan<span class="adm-nav-lencana" data-lencana="permintaan" hidden></span></a></li>
      <li><a href="#pengaturan"><span class="adm-nav-ikon" aria-hidden="true">⚙</span>Pengaturan</a></li>
    </ul>
  </aside>

  <main class="adm-main">
    <header class="adm-topbar">
      <div class="adm-topbar-brand" aria-hidden="true">
        <span class="adm-side-crown">♛</span>
        <span class="adm-topbar-nama">Mahkota Tahfizh Online</span>
        <span class="adm-side-peran">Admin</span>
      </div>
      <div class="adm-topbar-aksi">
        <button type="button" class="adm-ikon-btn" aria-label="Cari">⌕</button>
        <button type="button" class="adm-ikon-btn adm-ikon-btn-titik" aria-label="Notifikasi">🔔︎</button>
        <span class="adm-avatar" aria-hidden="true">A</span>
      </div>
    </header>
    <div class="adm-kerangka" id="admKerangka">Memuat halaman admin…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

</html>
