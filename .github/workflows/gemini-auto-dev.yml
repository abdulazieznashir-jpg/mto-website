name: Gemini Flash Auto Developer

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-next-step:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repositori terbaru
        uses: actions/checkout@v4

      - name: Jalankan Gemini Flash untuk 1 tugas berikutnya
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          if not os.path.exists("PLAN.md"):
              print("PLAN.md tidak ditemukan.")
              exit(0)

          with open("PLAN.md", "r", encoding="utf-8") as f:
              plan = f.read()

          if "- [ ]" not in plan:
              print("Semua tugas di PLAN.md sudah selesai!")
              exit(0)

          # Baca file kode website (HTML, CSS, JS, MD) tanpa menyentuh asset gambar/git/workflows
          allowed_ext = (".html", ".css", ".js", ".md", ".sql", ".json")
          repo_files = {}
          for root, dirs, files in os.walk("."):
              if ".git" in root or ".github" in root:
                  continue
              for file in files:
                  if file.endswith(allowed_ext):
                      path = os.path.join(root, file)[2:]
                      try:
                          with open(path, "r", encoding="utf-8") as fp:
                              repo_files[path] = fp.read()
                      except Exception:
                          pass

          prompt = f"""Kamu adalah Senior Frontend & Supabase Web Developer untuk Website Mahkota Tahfidz Online.
          Berikut adalah daftar tugas di PLAN.md:
          {plan}

          Berikut adalah isi file kode website saat ini (format JSON path: isi):
          {json.dumps(repo_files, ensure_ascii=False)}

          INSTRUKSI WAJIB:
          1. Ambil HANYA SATU tugas pertama yang masih bertanda `- [ ]` di PLAN.md.
          2. Kerjakan tugas tersebut secara lengkap, rapi, konsisten dengan desain Mahkota Tahfidz yang sudah ada, dan siap jalan.
          3. Jangan merusak konfigurasi koneksi Supabase yang sudah ada.
          4. Ubah tanda `- [ ]` menjadi `- [x]` pada tugas yang baru saja kamu selesaikan di PLAN.md.
          5. Kembalikan output HANYA dalam format JSON valid dengan struktur:
             {{"files": {{"nama_file_atau_path": "isi_lengkap_file", "PLAN.md": "isi_lengkap_PLAN_terbaru"}}}}
          Jangan tambahkan teks penjelasan di luar JSON."""

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={os.environ['GEMINI_API_KEY']}"
          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"responseMimeType": "application/json"}
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read().decode("utf-8"))

          text_out = result["candidates"][0]["content"]["parts"][0]["text"]
          parsed = json.loads(text_out)

          for filepath, content in parsed.get("files", {}).items():
              if filepath.startswith(".github") or filepath == ".cpanel.yml":
                  continue
              dirname = os.path.dirname(filepath)
              if dirname:
                  os.makedirs(dirname, exist_ok=True)
              with open(filepath, "w", encoding="utf-8") as out_f:
                  out_f.write(content)
              print(f"Updated: {filepath}")
          EOF

      - name: Simpan hasil kerja Gemini ke GitHub
        run: |
          git config user.name "Gemini Flash Bot"
          git config user.email "gemini-bot@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-dev: selesaikan tugas berikutnya dari PLAN.md"
          git push
