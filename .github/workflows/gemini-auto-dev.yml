name: Gemini Flash Auto Developer

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-next-step:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repositori terbaru
        uses: actions/checkout@v4

      - name: Jalankan Gemini Flash untuk 1 tugas berikutnya
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, re, json, time, urllib.request, urllib.error

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              print("ERROR: GEMINI_API_KEY kosong!")
              exit(1)

          if not os.path.exists("PLAN.md"):
              print("PLAN.md tidak ditemukan.")
              exit(0)

          with open("PLAN.md", "r", encoding="utf-8") as f:
              plan = f.read()

          unchecked = [line.strip() for line in plan.splitlines() if line.strip().startswith("- [ ]")]
          if not unchecked:
              print("Semua tugas di PLAN.md sudah selesai!")
              exit(0)

          current_task = unchecked[0]
          print(f"Mengerjakan tugas: {current_task}")

          # Pilih hanya file yang relevan dengan tugas saat ini agar hemat token (< 250k TPM)
          mentioned_files = set(re.findall(r'[\w\-/]+\.(?:html|css|js|md|sql|json)', current_task))
          mentioned_files.add("PLAN.md")
          if "admin.html" in mentioned_files:
              mentioned_files.update(["js/supabase-config.js", "js/auth.js", "supabase/schema.sql"])

          allowed_ext = (".html", ".css", ".js", ".md", ".sql", ".json")
          repo_files = {}
          total_chars = 0
          MAX_CHARS = 320000  # ~80.000 token, aman di bawah limit 250.000 token/menit

          for root, dirs, files in os.walk("."):
              if ".git" in root or ".github" in root:
                  continue
              for file in files:
                  if file.endswith(allowed_ext):
                      path = os.path.join(root, file)[2:]
                      if path in mentioned_files or any(m in path for m in mentioned_files):
                          try:
                              with open(path, "r", encoding="utf-8") as fp:
                                  content = fp.read()
                              if total_chars + len(content) <= MAX_CHARS:
                                  repo_files[path] = content
                                  total_chars += len(content)
                          except Exception:
                              pass

          # Jika belum ada file spesifik yang disebut di tugas, ambil daftar nama file saja sebagai referensi
          all_paths = []
          for root, dirs, files in os.walk("."):
              if ".git" in root or ".github" in root:
                  continue
              for file in files:
                  all_paths.append(os.path.join(root, file)[2:])

          prompt = f"""Kamu adalah Senior Frontend & Supabase Web Developer untuk Website Mahkota Tahfidz Online.
          Tugas saat ini yang WAJIB kamu selesaikan HANYA SATU tugas berikut:
          {current_task}

          Daftar seluruh file yang ada di repositori:
          {json.dumps(all_paths, ensure_ascii=False)}

          Isi file relevan saat ini (format JSON path: isi):
          {json.dumps(repo_files, ensure_ascii=False)}

          Isi lengkap PLAN.md saat ini:
          {plan}

          INSTRUKSI WAJIB:
          1. Kerjakan HANYA tugas `{current_task}` secara lengkap, rapi, konsisten dengan desain Apple Style Mahkota Tahfidz Online, dan siap jalan.
          2. JANGAN MENGUBAH atau menghapus angka harga paket, diskon, maupun struktur biaya terbaru yang sudah ada di file kode website saat ini.
          3. Jangan merusak konfigurasi koneksi Supabase dan penjagaan akses Owner (`abdulaziez.nashir@gmail.com`) yang sudah ada.
          4. Pada `PLAN.md`, ubah tanda `- [ ]` menjadi `- [x]` HANYA pada tugas yang baru saja kamu selesaikan ini, dan biarkan baris lainnya utuh.
          5. Kembalikan output HANYA dalam format JSON valid dengan struktur:
             {{"files": {{"nama_file_yang_diubah": "isi_lengkap_file", "PLAN.md": "isi_lengkap_PLAN_terbaru"}}}}
          Jangan tambahkan teks penjelasan di luar JSON."""

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"responseMimeType": "application/json"}
          }

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
          result = None

          for attempt in range(1, 4):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key,
                      "User-Agent": "Mozilla/5.0 (compatible; GitHubActionsBot/1.0)"
                  }
              )
              try:
                  print(f"Percobaan {attempt} mengirim {total_chars} karakter ke gemini-3.8-flash...")
                  with urllib.request.urlopen(req) as resp:
                      result = json.loads(resp.read().decode("utf-8"))
                  break
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="replace")
                  print(f"HTTP Error {e.code} pada percobaan {attempt}: {err_body}")
                  if e.code in (429, 500, 503) and attempt < 3:
                      wait_sec = 40 if e.code == 429 else 15
                      print(f"Menunggu {wait_sec} detik sebelum mencoba ulang...")
                      time.sleep(wait_sec)
                      continue
                  exit(1)

          text_out = result["candidates"][0]["content"]["parts"][0]["text"]
          parsed = json.loads(text_out)

          for filepath, content in parsed.get("files", {}).items():
              if filepath.startswith(".github") or filepath == ".cpanel.yml":
                  continue
              dirname = os.path.dirname(filepath)
              if dirname:
                  os.makedirs(dirname, exist_ok=True)
              with open(filepath, "w", encoding="utf-8") as out_f:
                  out_f.write(content)
              print(f"Updated: {filepath}")
          EOF

      - name: Simpan hasil kerja Gemini ke GitHub
        run: |
          git config user.name "Gemini Flash Bot"
          git config user.email "gemini-bot@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-dev: selesaikan tugas berikutnya dari PLAN.md"
          git push
